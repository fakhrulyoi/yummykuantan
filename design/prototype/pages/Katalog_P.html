<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Yummy Kuantan: Koleksi telefon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
@@FONTS@@
<style>@@CSS_B@@</style>
</helmet>
<div class="b" style="width: 390px; min-height: 5600px; position: relative; font-family: 'Manrope', system-ui, sans-serif; color: #F2E7DE; background: #4B141B; font-size: 15.5px; line-height: 1.5">
@@HDR_P:Home_P.dc.html:Koleksi@@
<div style="padding: 16px 16px 0">
<h1 style="font-size: 40px; line-height: 1">{{title}}</h1>
<p style="color: #D3B1AB; font-size: 14px; margin-top: 4px">{{countLabel}}, tempah terus melalui WhatsApp</p>
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Cari kek</label>
<input id="q" class="b-in" type="search" placeholder="Cari nama kek atau rasa" value="{{q}}" onInput="{{setQ}}" style="margin-top: 14px">
</div>
<div style="display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="7"><button class="b-chip" onClick="{{c.pick}}" aria-pressed="{{c.on}}">{{c.name}}</button></sc-for>
</div>
<div style="display: flex; gap: 8px; padding: 8px 16px 0; align-items: center">
<label for="sort" style="font-size: 13.5px; color: #D3B1AB">Susun</label>
<select id="sort" class="b-in" value="{{sort}}" onChange="{{setSort}}" style="flex: 1; min-height: 44px"><option value="pop">Paling kerap ditempah</option><option value="low">Harga rendah ke tinggi</option><option value="high">Harga tinggi ke rendah</option></select>
</div>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><div style="margin: 20px 16px; padding: 40px 16px; border: 1px dashed #8A4A52; text-align: center"><p style="font-family: 'Libre Caslon Display', serif; font-size: 24px">Tiada kek sepadan.</p><button class="b-btn b-line" onClick="{{reset}}" style="margin-top: 14px">Kosongkan tapisan</button></div></sc-if>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 18px 16px">
<sc-for list="{{items}}" as="p" hint-placeholder-count="10">
<article class="yk-tile yk-in" style="grid-column: span {{p.cs}}; aspect-ratio: {{p.ar}}; animation-delay: {{p.d}}">
<a href="Produk_P.dc.html" aria-label="{{p.name}}" style="position: absolute; inset: 0"><img src="{{p.img}}" alt=""></a>
<span aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(42,9,14,0) 45%, rgba(42,9,14,.9) 100%)"></span>
<button class="b-fav" onClick="{{p.toggle}}" aria-pressed="{{p.fav}}" aria-label="Simpan {{p.name}}" style="top: 6px; right: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{p.heart}}" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"></path></svg></button>
<div style="position: absolute; left: 12px; right: 12px; bottom: 10px; pointer-events: none"><h2 style="font-size: {{p.fs}}; line-height: 1.08">{{p.name}}</h2><p style="font-size: 12.5px; color: #ECDDD3">dari RM {{p.price}}</p></div>
</article>
</sc-for>
</div>
@@FTR_P@@
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":5600}}'>
@@PRODUCTS@@
@@CATS@@
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { cat: 'Semua', q: '', sort: 'pop', favs: {}, cart: 0 }; }
  renderVals() {
    const s = this.state; const q = s.q.trim().toLowerCase();
    let items = PRODUCTS.filter((p) => (s.cat === 'Semua' || p.cat === s.cat) && (!q || (p.name + ' ' + p.desc).toLowerCase().includes(q)));
    items = items.slice().sort((a, b) => s.sort === 'low' ? a.price - b.price : s.sort === 'high' ? b.price - a.price : b.pop - a.pop);
    return {
      cart: s.cart, title: s.cat === 'Semua' ? 'Koleksi' : s.cat, countLabel: items.length + ' kek',
      q: s.q, setQ: (e) => this.setState({ q: e.target.value }), sort: s.sort, setSort: (e) => this.setState({ sort: e.target.value }),
      cats: ['Semua', ...CATS].map((c) => ({ name: c, on: s.cat === c ? 'true' : 'false', pick: () => this.setState({ cat: c }) })),
      empty: items.length === 0, reset: () => this.setState({ cat: 'Semua', q: '' }),
      items: items.map((p, i) => ({ ...p, cs: i % 5 === 0 ? 2 : 1, ar: i % 5 === 0 ? '4 / 3' : '3 / 4', fs: i % 5 === 0 ? '28px' : '18px', d: Math.min(1, 0.05 + i * 0.05).toFixed(2) + 's', fav: s.favs[p.id] ? 'true' : 'false', heart: s.favs[p.id] ? 'currentColor' : 'none', toggle: () => this.setState({ favs: { ...s.favs, [p.id]: !s.favs[p.id] } }) })),
    };
  }
}
</script>
</body>
</html>
